name: Deploy Infrastructure to GCP

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GCP via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            echo "🚀 Pulling new Infrastructure configurations..."
            cd ~/al-mizan-deployments
            git pull
            
            echo "⚙️ Applying Docker Compose changes..."
            docker compose up -d
            
            echo "✅ Infrastructure Deployment Successful!"
