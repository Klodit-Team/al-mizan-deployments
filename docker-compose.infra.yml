services:
  mysql:
    image: mysql:8
    container_name: al-mizan-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - al-mizan-network
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: al-mizan-redis
    ports:
      - "6379:6379"
    networks:
      - al-mizan-network
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: al-mizan-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - al-mizan-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  minio:
    image: minio/minio
    container_name: al-mizan-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - al-mizan-network
    restart: unless-stopped

volumes:
  mysql_data:
  postgres_data:
  minio_data:

networks:
  al-mizan-network:
    external: true