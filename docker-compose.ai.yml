# ═══════════════════════════════════════════════════════════════════════════════
# AL-MIZAN — AI Layer Compose
# Five one-shot agents + AI Orchestrator.
# Requires docker-compose.infra.yml + docker-compose.yml to be running first.
#
# Usage:
#   docker compose -f docker-compose.infra.yml -f docker-compose.yml -f docker-compose.ai.yml up -d
#   (or simply: make up-ai)
#
# Agent runs:
#   Agents are one-shot: they start, execute their workflow, then exit (restart: "no").
#   The AI Orchestrator is a long-running service that listens for RabbitMQ events
#   and launches agents automatically.
# ═══════════════════════════════════════════════════════════════════════════════

# ─── Common MCP + backend env shared by all agents ───────────────────────────
x-agent-common: &agent-common
  build:
    context: ../
    dockerfile: ai-agents/Dockerfile
  working_dir: /workspace
  restart: "no"
  depends_on:
    al-mizan-rabbitmq:
      condition: service_healthy
  networks:
    - al-mizan-network

x-backend-env: &backend-env
  # ── Backend service URLs (container-to-container) ──
  AO_BASE_URL: http://appel-offres-service:8003
  AO_SERVICE_TOKEN: ${AO_SERVICE_TOKEN}
  AO_GRE_A_GRE_SCORE_ENDPOINT: /appels-offres/gre-a-gre/{demandeId}/score-ia
  SOUMMISSION_BASE_URL: http://soumission-service:8004
  SOUMMISSION_SERVICE_TOKEN: ${SOUMMISSION_SERVICE_TOKEN}
  SOUMMISSION_ANOMALY_ENDPOINT: /api/v1/soumissions/{soumissionId}/anomalies
  DOCUMENTS_BASE_URL: http://documents-service:8005
  DOCUMENTS_SERVICE_TOKEN: ${DOCUMENTS_SERVICE_TOKEN}
  DOCUMENTS_RABBITMQ_URL: amqp://guest:guest@al-mizan-rabbitmq:5672
  DOCUMENTS_OCR_RESULTS_QUEUE: documents.ocr.results
  EVALUATION_BASE_URL: http://evaluation-service:8008
  EVALUATION_SERVICE_TOKEN: ${EVALUATION_SERVICE_TOKEN}
  EVALUATION_SCORE_IA_ENDPOINT: /api/v1/evaluations/{evaluationId}/soumissions/{submissionId}/score-ia
  EVALUATION_COMPARISON_ENDPOINT: /api/v1/evaluations/{evaluationId}/soumissions/{submissionId}/comparison
  USERS_BASE_URL: http://users-service:3002
  USERS_SERVICE_TOKEN: ${USERS_SERVICE_TOKEN}
  NOTIFICATIONS_BASE_URL: http://notification-service:8010/notification-service/v1
  NOTIFICATIONS_SERVICE_TOKEN: ${NOTIFICATIONS_SERVICE_TOKEN}
  AUDIT_BASE_URL: http://audit-service:3009
  AUDIT_SERVICE_TOKEN: ${AUDIT_SERVICE_TOKEN}
  STORAGE_BASE_URL: http://al-mizan-minio:9000
  STORAGE_TIMEOUT_MS: 15000
  # ── External AI/ML services ──
  DOC_ANALYSIS_BASE_URL: ${DOC_ANALYSIS_BASE_URL:-http://localhost:4011}
  DOC_ANALYSIS_TIMEOUT_MS: ${DOC_ANALYSIS_TIMEOUT_MS:-20000}
  NLP_BASE_URL: ${NLP_BASE_URL:-http://localhost:4014}
  NLP_TIMEOUT_MS: ${NLP_TIMEOUT_MS:-15000}
  ANOMALY_BASE_URL: ${ANOMALY_BASE_URL:-http://localhost:4012}
  ANOMALY_TIMEOUT_MS: ${ANOMALY_TIMEOUT_MS:-20000}
  LLM_ONPREM_ENDPOINT: ${LLM_ONPREM_ENDPOINT}
  LLM_EXTERNAL_ENDPOINT: ${LLM_EXTERNAL_ENDPOINT}
  LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-20000}

x-mcp-env: &mcp-env
  MCP_AO_COMMAND: tsx
  MCP_AO_ARGS: '["src/index.ts"]'
  MCP_AO_CWD: /workspace/mcp/mcp-ao
  MCP_SOUMISSIONS_COMMAND: tsx
  MCP_SOUMISSIONS_ARGS: '["src/index.ts"]'
  MCP_SOUMISSIONS_CWD: /workspace/mcp/mcp-soumissions
  MCP_DOCUMENTS_COMMAND: tsx
  MCP_DOCUMENTS_ARGS: '["src/index.ts"]'
  MCP_DOCUMENTS_CWD: /workspace/mcp/mcp-documents
  MCP_STORAGE_COMMAND: tsx
  MCP_STORAGE_ARGS: '["src/index.ts"]'
  MCP_STORAGE_CWD: /workspace/mcp/mcp-storage
  MCP_DOCUMENT_ANALYSIS_COMMAND: tsx
  MCP_DOCUMENT_ANALYSIS_ARGS: '["src/index.ts"]'
  MCP_DOCUMENT_ANALYSIS_CWD: /workspace/mcp/mcp-document-analysis
  MCP_NLP_COMMAND: tsx
  MCP_NLP_ARGS: '["src/index.ts"]'
  MCP_NLP_CWD: /workspace/mcp/mcp-nlp
  MCP_ANOMALY_COMMAND: tsx
  MCP_ANOMALY_ARGS: '["src/index.ts"]'
  MCP_ANOMALY_CWD: /workspace/mcp/mcp-anomaly
  MCP_EVALUATION_COMMAND: tsx
  MCP_EVALUATION_ARGS: '["src/index.ts"]'
  MCP_EVALUATION_CWD: /workspace/mcp/mcp-evaluation
  MCP_USERS_COMMAND: tsx
  MCP_USERS_ARGS: '["src/index.ts"]'
  MCP_USERS_CWD: /workspace/mcp/mcp-users
  MCP_NOTIFICATIONS_COMMAND: tsx
  MCP_NOTIFICATIONS_ARGS: '["src/index.ts"]'
  MCP_NOTIFICATIONS_CWD: /workspace/mcp/mcp-notifications
  MCP_LLM_COMMAND: tsx
  MCP_LLM_ARGS: '["src/index.ts"]'
  MCP_LLM_CWD: /workspace/mcp/mcp-llm
  MCP_AUDIT_COMMAND: tsx
  MCP_AUDIT_ARGS: '["src/index.ts"]'
  MCP_AUDIT_CWD: /workspace/mcp/mcp-audit

services:

  # ─── AI Orchestrator (long-running; listens to RabbitMQ, spawns agents) ────
  ai-orchestrator:
    build:
      context: ../
      dockerfile: ai-orchestrator/Dockerfile
    container_name: ai-orchestrator
    working_dir: /workspace
    environment:
      <<: [*backend-env, *mcp-env]
      RABBITMQ_URL: amqp://guest:guest@al-mizan-rabbitmq:5672
      AI_AGENTS_PATH: /workspace/ai-agents/src/agents
      NODE_ENV: production
      PORT: 3099
    depends_on:
      al-mizan-rabbitmq:
        condition: service_healthy
    networks:
      - al-mizan-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3099"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── OCR/NLP Agent ─────────────────────────────────────────────────────────
  ocr-nlp-agent:
    <<: *agent-common
    container_name: ocr-nlp-agent
    command: tsx src/agents/ocr-nlp-agent.ts
    environment:
      <<: [*backend-env, *mcp-env]
      SUBMISSION_ID: ${SUBMISSION_ID}
      REQUIRED_FIELDS_JSON: ${REQUIRED_FIELDS_JSON}
      FIELDS_SCHEMA_JSON: ${FIELDS_SCHEMA_JSON}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0}
      ALERT_THRESHOLD_DAYS: ${ALERT_THRESHOLD_DAYS}
      ALERT_USER_IDS: ${ALERT_USER_IDS}

  # ─── Anomaly Detection Agent ───────────────────────────────────────────────
  anomaly-agent:
    <<: *agent-common
    container_name: anomaly-agent
    command: tsx src/agents/anomaly-agent.ts
    environment:
      <<: [*backend-env, *mcp-env]
      AO_ID: ${AO_ID}
      ANOMALY_ALERT_THRESHOLD: ${ANOMALY_ALERT_THRESHOLD:-1}
      RELATED_AO_SET_JSON: ${RELATED_AO_SET_JSON}

  # ─── Evaluation Assistant Agent ────────────────────────────────────────────
  evaluation-agent:
    <<: *agent-common
    container_name: evaluation-agent
    command: tsx src/agents/evaluation-agent.ts
    environment:
      <<: [*backend-env, *mcp-env]
      AO_ID: ${AO_ID}
      EVALUATION_ID: ${EVALUATION_ID}

  # ─── GenAI CDC Assistant Agent ─────────────────────────────────────────────
  genai-cdc-agent:
    <<: *agent-common
    container_name: genai-cdc-agent
    command: tsx src/agents/genai-cdc-agent.ts
    environment:
      <<: [*backend-env, *mcp-env]
      AO_ID: ${AO_ID}
      SECTION_TYPE: ${SECTION_TYPE}
      USER_PROMPT: ${USER_PROMPT}
      LLM_SENSITIVITY: ${LLM_SENSITIVITY:-non_sensitive}

  # ─── Gré-à-Gré Agent ──────────────────────────────────────────────────────
  gre-a-gre-agent:
    <<: *agent-common
    container_name: gre-a-gre-agent
    command: tsx src/agents/gre-a-gre-agent.ts
    environment:
      <<: [*backend-env, *mcp-env]
      AO_ID: ${AO_ID}
      GAG_ID: ${GAG_ID}
      USER_ID: ${USER_ID}
      JUSTIFICATION_TEXT: ${JUSTIFICATION_TEXT}
      REGULATORY_RULES_JSON: ${REGULATORY_RULES_JSON}
      SUPPORTING_DOCUMENT_IDS_JSON: ${SUPPORTING_DOCUMENT_IDS_JSON}

networks:
  al-mizan-network:
    name: al-mizan-network
    driver: bridge
